name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A rapid series of pushes to a PR should not pile up redundant matrix runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: ${{ matrix.os }} / quarto ${{ matrix.quarto }}${{ !matrix.tinytex && ' (no PDF)' || '' }}
    runs-on: ${{ matrix.os }}
    # Three legs. TinyTeX/PDF-compile only runs on one of them: it is the only
    # check that catches a corrupted LaTeX preamble (rendering to "latex"
    # exits 0 even when the .tex will not compile), but that failure mode
    # lives in the filter's Lua, not in the OS or Quarto channel, so one leg
    # covers it. The other two skip it (--no-pdf) to stay fast — a Windows
    # PDF-compile failure isn't a plausible bug class for a filter that emits
    # no LaTeX. windows-latest/pre-release is dropped entirely: it would only
    # add OS coverage already given by windows-latest/release and channel
    # coverage already given by ubuntu-latest/pre-release.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            quarto: release
            tinytex: true
          - os: ubuntu-latest
            quarto: pre-release
            tinytex: false
          - os: windows-latest
            quarto: release
            tinytex: false

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.quarto }}
          tinytex: ${{ matrix.tinytex }}

      # example.qmd has a live {python} cell (the "Driven by computed data"
      # example), so the demo deck build below needs a Jupyter kernel. Two
      # interpreters are involved and Quarto resolves each independently, so
      # both get pinned rather than left to auto-detection (unreliable
      # across shells/virtual envs — see CONTRIBUTING.md): QUARTO_PYTHON
      # below pins the "driver" Quarto itself uses to run its jupyter
      # control script, and the named kernel pins the interpreter that
      # actually executes the cell, matching example.qmd's frontmatter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps for example.qmd's live code cell
        run: pip install -r requirements-docs.txt

      - name: Point Quarto's jupyter driver at this interpreter
        shell: bash
        run: echo "QUARTO_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Register the Jupyter kernel example.qmd targets by name
        run: python -m ipykernel install --user --name quarto-value-box-docs --display-name "quarto-value-box docs"

      # The runner also builds example.qmd, so this covers the project's
      # long-standing bar of "the demo deck renders".
      - name: Run the test matrix
        shell: bash
        run: bash tests/run-tests.sh${{ !matrix.tinytex && ' --no-pdf' || '' }}

      - name: Upload rendered output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-quarto-${{ matrix.quarto }}
          path: tests/_work/
          if-no-files-found: ignore
          retention-days: 7

  # index.html / example_files/ are no longer committed (see CONTRIBUTING.md)
  # — this is the only place the demo deck is actually rendered for publishing.
  # Gated behind `render` passing on every matrix leg, so a broken filter or
  # deck never reaches the live site.
  deploy:
    name: Deploy demo to GitHub Pages
    needs: render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploys must not be cancelled mid-flight (could leave Pages serving a
    # half-uploaded site), so this gets its own serialised group rather than
    # sharing the workflow's cancel-in-progress group above.
    concurrency:
      group: pages
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python deps for example.qmd's live code cell
        run: pip install -r requirements-docs.txt

      - name: Point Quarto's jupyter driver at this interpreter
        shell: bash
        run: echo "QUARTO_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Register the Jupyter kernel example.qmd targets by name
        run: python -m ipykernel install --user --name quarto-value-box-docs --display-name "quarto-value-box docs"

      - name: Render the demo deck
        run: quarto render example.qmd

      # index.html renders into the repo root alongside source files, and
      # itself references example-icon.png/.svg directly (not copied into
      # example_files/ by Quarto) — so stage exactly the published site's
      # files rather than uploading the whole checkout.
      - name: Stage the site
        run: |
          mkdir _site
          cp index.html example-icon.png example-icon.svg _site/
          cp -r example_files _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
