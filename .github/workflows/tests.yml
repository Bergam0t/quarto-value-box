name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A rapid series of pushes to a PR should not pile up redundant matrix runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: ${{ matrix.os }} / quarto ${{ matrix.quarto }}${{ !matrix.tinytex && ' (no PDF)' || '' }}
    runs-on: ${{ matrix.os }}
    # Three legs. TinyTeX/PDF-compile only runs on one of them: it is the only
    # check that catches a corrupted LaTeX preamble (rendering to "latex"
    # exits 0 even when the .tex will not compile), but that failure mode
    # lives in the filter's Lua, not in the OS or Quarto channel, so one leg
    # covers it. The other two skip it (--no-pdf) to stay fast — a Windows
    # PDF-compile failure isn't a plausible bug class for a filter that emits
    # no LaTeX. windows-latest/pre-release is dropped entirely: it would only
    # add OS coverage already given by windows-latest/release and channel
    # coverage already given by ubuntu-latest/pre-release.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            quarto: release
            tinytex: true
          - os: ubuntu-latest
            quarto: pre-release
            tinytex: false
          - os: windows-latest
            quarto: release
            tinytex: false

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ matrix.quarto }}
          tinytex: ${{ matrix.tinytex }}

      # The runner also builds example.qmd, so this covers the project's
      # long-standing bar of "the demo deck renders".
      - name: Run the test matrix
        shell: bash
        run: bash tests/run-tests.sh${{ !matrix.tinytex && ' --no-pdf' || '' }}

      - name: Upload rendered output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-quarto-${{ matrix.quarto }}
          path: tests/_work/
          if-no-files-found: ignore
          retention-days: 7
